<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 프로필 링크</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 40px 24px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .profile-bio {
      font-size: 0.92rem;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      padding: 16px 20px;
      background-color: #ffffff;
      color: #1f2937;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 600;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .link-btn svg {
      position: absolute;
      left: 20px;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    /* 플랫폼별 포인트 컬러 호버 효과 */
    .btn-instagram:hover {
      border-color: #e1306c;
      color: #e1306c;
    }

    .btn-youtube:hover {
      border-color: #ff0000;
      color: #ff0000;
    }

    .btn-blog:hover {
      border-color: #03c75a;
      color: #03c75a;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- 1. 프로필 사진 (src 경로를 본인 이미지 파일이나 URL로 변경하세요) -->
    <img 
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
      alt="프로필 사진" 
      class="profile-img"
    />

    <!-- 2. 이름 및 자기소개 -->
    <h1 class="profile-name">홍길동 (@gildong)</h1>
    <p class="profile-bio">
      일상과 기록을 좋아합니다 ✨<br />
      아래 채널에서 더 많은 이야기를 만나보세요!
    </p>

    <!-- 3. 링크 버튼 목록 (href에 본인 주소를 입력하세요) -->
    <nav class="links">
      <!-- 인스타그램 -->
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="link-btn btn-instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        <span>인스타그램 (Instagram)</span>
      </a>

      <!-- 유튜브 -->
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="link-btn btn-youtube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
          <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
        </svg>
        <span>유튜브 (YouTube)</span>
      </a>

      <!-- 블로그 -->
      <a href="https://blog.naver.com" target="_blank" rel="noopener noreferrer" class="link-btn btn-blog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>개인 블로그 (Blog)</span>
      </a>
    </nav>

    <footer class="footer">
      © 2026 홍길동. All rights reserved.
    </footer>
  </main>

</body>
</html>
